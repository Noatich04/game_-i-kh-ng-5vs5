<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Strike Five — FPS 5v5</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b10;font-family:Inter,system-ui,Arial,sans-serif;color:#fff}canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}#top{display:flex;justify-content:center;gap:18px;padding:16px;font-weight:800;font-size:20px;text-shadow:0 2px 5px #000}
.score{padding:7px 14px;border-radius:10px;background:#101722d9;border:1px solid #ffffff20}.blue{color:#55aaff}.red{color:#ff6464}
#cross{position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%)}.crossH{position:absolute;left:0;top:10px;width:22px;height:2px;background:#fff;box-shadow:0 0 4px #000}.crossV{position:absolute;left:10px;top:0;width:2px;height:22px;background:#fff;box-shadow:0 0 4px #000}#hitMarker{position:absolute;left:50%;top:50%;width:30px;height:30px;transform:translate(-50%,-50%) rotate(45deg);opacity:0;transition:opacity .08s}#hitMarker::before,#hitMarker::after{content:"";position:absolute;left:14px;top:2px;width:2px;height:26px;background:#ffdf6b;box-shadow:0 0 8px #ffb000}#hitMarker::after{transform:rotate(90deg)}#muzzleFlash{position:absolute;left:50%;top:50%;width:180px;height:180px;transform:translate(-20%,-20%);border-radius:50%;background:radial-gradient(circle,rgba(255,245,180,.95) 0%,rgba(255,172,45,.62) 12%,rgba(255,80,10,.18) 34%,transparent 65%);mix-blend-mode:screen;opacity:0;pointer-events:none}#muzzleFlash.show{animation:mflash .08s ease-out}@keyframes mflash{0%{opacity:1;transform:translate(-20%,-20%) scale(.6)}100%{opacity:0;transform:translate(-20%,-20%) scale(1.25)}}
#health{position:absolute;left:20px;bottom:62px;width:230px;font-size:18px;background:#101722d9;padding:9px 13px;border-radius:10px;border:1px solid #ffffff20}.hpBar{width:100%;height:12px;margin-top:7px;border-radius:8px;background:#27313d;overflow:hidden;box-shadow:inset 0 0 0 1px #ffffff18}.hpFill{height:100%;width:100%;border-radius:8px;background:linear-gradient(90deg,#47d66b,#a5f26b);transform-origin:left center;transition:width .12s ease,background .12s ease}#damageFx{position:fixed;inset:0;z-index:8;pointer-events:none;background:radial-gradient(circle,transparent 35%,rgba(255,50,50,.18) 68%,rgba(255,30,30,.72) 100%);opacity:0}#damageFx.show{animation:damageFlash .42s ease-out}@keyframes damageFlash{0%{opacity:1}35%{opacity:.72}100%{opacity:0}}#hurtVignette{position:fixed;inset:0;z-index:7;pointer-events:none;opacity:0;box-shadow:inset 0 0 120px rgba(255,30,30,.8)}#hurtVignette.show{animation:vignette .5s ease-out}@keyframes vignette{0%{opacity:1}100%{opacity:0}}#ammo{position:absolute;right:20px;bottom:20px;font-size:25px;font-weight:800;background:#101722d9;padding:9px 13px;border-radius:10px}
#feed{position:absolute;right:20px;top:70px;width:310px;text-align:right;font-size:14px}.kill{margin:4px 0;text-shadow:0 2px 4px #000}
#start,#end{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#172438dd,#05070bd9);text-align:center}.panel{max-width:620px;padding:34px;border:1px solid #ffffff22;border-radius:18px;background:#0c111bd9;box-shadow:0 20px 70px #000}
h1{font-size:44px;margin:0 0 8px}p{line-height:1.6;color:#b9c5d4}button{pointer-events:auto;border:0;border-radius:10px;padding:12px 22px;font-size:16px;font-weight:800;cursor:pointer;background:#4da3ff;color:#06101d}#end{display:none}.small{font-size:13px;color:#8492a5}
</style>
</head>
<body>
<div id="start"><div class="panel"><h1>STRIKE FIVE</h1><p>FPS đối kháng 5v5. Đội nào đạt <b>30 mạng</b> trước sẽ thắng.</p><p><b>WASD</b> di chuyển · <b>Chuột</b> ngắm/bắn · <b>R</b> nạp đạn · <b>Shift</b> chạy nhanh · <b>ESC</b> mở chuột</p><p class="small">Prototype: bạn đấu cùng 4 đồng đội AI với 5 bot đối phương.</p><button id="startBtn">VÀO TRẬN</button></div></div>
<div id="end"><div class="panel"><h1 id="winner"></h1><p id="final"></p><button id="restart">CHƠI LẠI</button></div></div>
<div id="damageFx"></div><div id="hurtVignette"></div><div id="hud"><div id="top"><span class="score blue" id="blueScore">BLUE 0</span><span class="score" id="timer">02:00</span><span class="score red" id="redScore">RED 0</span></div><div id="cross"><span class="crossH"></span><span class="crossV"></span></div><div id="hitMarker"></div><div id="muzzleFlash"></div><div id="health">HP 100<div class="hpBar"><div id="hpFill" class="hpFill"></div></div></div><div id="ammo">30 / 120</div><div id="feed"></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x09101a);
scene.fog = new THREE.Fog(0x09101a, 45, 145);

const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.05, 180);
camera.rotation.order = 'YXZ';
camera.position.set(-54, 1.7, 0);
camera.rotation.y = -Math.PI / 2;
scene.add(camera);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xbddcff, 0x20252b, 2.0));
const sun = new THREE.DirectionalLight(0xffffff, 2.1);
sun.position.set(15, 35, 12);
sun.castShadow = true;
scene.add(sun);

const blockers = [];
const colliders = [];
function box(x, y, z, sx, sy, sz, color, isSolid = true) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(sx, sy, sz),
    new THREE.MeshStandardMaterial({ color, roughness: 0.86 })
  );
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  if (isSolid) {
    blockers.push(mesh);
    colliders.push({
      minX: x - sx / 2, maxX: x + sx / 2,
      minY: y - sy / 2, maxY: y + sy / 2,
      minZ: z - sz / 2, maxZ: z + sz / 2
    });
  }
  return mesh;
}

// Arena floor is visible but does not block movement or horizontal shots.
box(0, -0.5, 0, 122, 1, 86, 0x1c2631, false);
box(0, 3, -43, 122, 7, 1, 0x202b38);
box(0, 3, 43, 122, 7, 1, 0x202b38);
box(-61, 3, 0, 1, 7, 86, 0x202b38);
box(61, 3, 0, 1, 7, 86, 0x202b38);

// Solid cover: rendered meshes, raycast blockers, and player/bot colliders all use the same definitions.
[
  [-22, 2, -15, 12, 4, 3],
  [22, 2, 15, 12, 4, 3],
  [-8, 2, 16, 4, 4, 10],
  [8, 2, -16, 4, 4, 10],
  [-38, 1, 13, 8, 2, 4],
  [38, 1, -13, 8, 2, 4],
  [-1, 1, 0, 6, 2, 6],
  [-30, 1, -8, 5, 2, 3],
  [30, 1, 8, 5, 2, 3],
  [-44, 1.5, 4, 2, 3, 2],
  [-36, 1.5, -4, 2, 3, 2],
  [-28, 1.5, 4, 2, 3, 2],
  [-20, 1.5, -4, 2, 3, 2],
  [20, 1.5, 4, 2, 3, 2],
  [28, 1.5, -4, 2, 3, 2],
  [36, 1.5, 4, 2, 3, 2],
  [44, 1.5, -4, 2, 3, 2]
].forEach(v => box(v[0], v[1], v[2], v[3], v[4], v[5], 0x344453));

const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.code === 'KeyR') reload();
});
addEventListener('keyup', e => { keys[e.code] = false; });

let started = false;
let gameOver = false;
let timeLeft = 120;
let last = performance.now();
let yaw = -Math.PI / 2;
let pitch = 0;
let hp = 100;
let ammo = 30;
let reserve = 120;
let reloading = false;
let shootCD = 0;
let respawnAt = 0;
let damageShake = 0;
let lastDamageNotice = 0;

const blueScoreEl = document.querySelector('#blueScore');
const redScoreEl = document.querySelector('#redScore');
const timerEl = document.querySelector('#timer');
const healthEl = document.querySelector('#health');
const hpFillEl = document.querySelector('#hpFill');
const ammoEl = document.querySelector('#ammo');
const feedEl = document.querySelector('#feed');
const hitMarkerEl = document.querySelector('#hitMarker');
const muzzleFlashEl = document.querySelector('#muzzleFlash');
const damageFxEl = document.querySelector('#damageFx');
const hurtVignetteEl = document.querySelector('#hurtVignette');

const bots = [];
const blueSpawn = [[-47, 0, -27], [-47, 0, -9], [-47, 0, 9], [-47, 0, 27]];
const redSpawn = [[50, 0, -28], [50, 0, -14], [50, 0, 0], [50, 0, 14], [50, 0, 28]];
const playerSpawn = [-54, 1.7, 0];
const state = { blue: 0, red: 0 };

function createBot(team, i) {
  const g = new THREE.Group();
  const color = team === 'blue' ? 0x2686df : 0xd63d49;

  const hpBack = new THREE.Mesh(
    new THREE.PlaneGeometry(1.35, 0.12),
    new THREE.MeshBasicMaterial({ color: 0x11151b, transparent: true, opacity: 0.9, depthWrite: false, side: THREE.DoubleSide })
  );
  hpBack.position.set(0, 2.68, 0);
  g.add(hpBack);

  const hpFill = new THREE.Mesh(
    new THREE.PlaneGeometry(1.27, 0.075),
    new THREE.MeshBasicMaterial({ color: team === 'blue' ? 0x4fc3ff : 0xff565f, depthWrite: false, side: THREE.DoubleSide })
  );
  hpFill.position.set(0, 2.68, 0.01);
  g.add(hpFill);

  const body = new THREE.Mesh(
    new THREE.BoxGeometry(0.85, 1.25, 0.58),
    new THREE.MeshStandardMaterial({ color, roughness: 0.7 })
  );
  body.position.y = 1.25;
  body.castShadow = true;
  g.add(body);

  const head = new THREE.Mesh(
    new THREE.BoxGeometry(0.56, 0.56, 0.56),
    new THREE.MeshStandardMaterial({ color: 0xc9a37a, roughness: 0.75 })
  );
  head.position.y = 2.18;
  head.castShadow = true;
  g.add(head);

  const p = team === 'blue' ? blueSpawn[i] : redSpawn[i];
  g.position.set(p[0], p[1], p[2]);
  scene.add(g);

  const b = {
    g, team, i, hp: 100, alive: true, respawn: 0,
    fire: 0.45 + Math.random() * 1.2,
    path: Math.random() * Math.PI * 2,
    hpBack, hpFill, body, head,
    moveTarget: null, retargetIn: 0
  };
  body.userData.bot = b;
  body.userData.isHead = false;
  head.userData.bot = b;
  head.userData.isHead = true;
  return b;
}
for (let i = 0; i < 4; i++) bots.push(createBot('blue', i));
for (let i = 0; i < 5; i++) bots.push(createBot('red', i));

// Simple first-person rifle model attached to the camera.
const weapon = new THREE.Group();
const gunMat = new THREE.MeshStandardMaterial({ color: 0x20242b, roughness: 0.55, metalness: 0.5 });
const gunBody = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.18, 0.72), gunMat);
gunBody.position.set(0.31, -0.25, -1.05);
weapon.add(gunBody);
const grip = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.34, 0.15), gunMat);
grip.position.set(0.30, -0.43, -0.91);
grip.rotation.x = -0.18;
weapon.add(grip);
const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.055, 0.66, 10), gunMat);
barrel.position.set(0.31, -0.20, -1.42);
barrel.rotation.x = Math.PI / 2;
weapon.add(barrel);
const sight = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.07, 0.18), gunMat);
sight.position.set(0.31, -0.13, -1.14);
weapon.add(sight);
const muzzleOrb = new THREE.Mesh(
  new THREE.SphereGeometry(0.07, 10, 10),
  new THREE.MeshBasicMaterial({ color: 0xffcf5b, transparent: true, opacity: 0 })
);
muzzleOrb.position.set(0.31, -0.20, -1.76);
weapon.add(muzzleOrb);
camera.add(weapon);

function feed(message) {
  const d = document.createElement('div');
  d.className = 'kill';
  d.textContent = message;
  feedEl.prepend(d);
  setTimeout(() => d.remove(), 2100);
}

function updateUI() {
  blueScoreEl.textContent = 'BLUE ' + state.blue;
  redScoreEl.textContent = 'RED ' + state.red;
  const curHp = Math.max(0, Math.round(hp));
  healthEl.firstChild.textContent = 'HP ' + curHp;
  hpFillEl.style.width = curHp + '%';
  hpFillEl.style.background = curHp <= 30
    ? 'linear-gradient(90deg,#ff4141,#ff8a62)'
    : curHp <= 60
      ? 'linear-gradient(90deg,#ff9f43,#ffe066)'
      : 'linear-gradient(90deg,#47d66b,#a5f26b)';
  ammoEl.textContent = reloading ? 'NẠP ĐẠN...' : ammo + ' / ' + reserve;
  timerEl.textContent = String(Math.max(0, Math.floor(timeLeft / 60))).padStart(2, '0') + ':' +
    String(Math.max(0, Math.ceil(timeLeft % 60))).padStart(2, '0');
}

function endGame() {
  if (gameOver) return;
  gameOver = true;
  if (document.pointerLockElement) document.exitPointerLock();
  document.querySelector('#end').style.display = 'flex';
  let win = state.blue === state.red ? 'HÒA TRẬN' : (state.blue > state.red ? 'BLUE TEAM THẮNG!' : 'RED TEAM THẮNG!');
  if (state.blue >= 30) win = 'BLUE TEAM THẮNG!';
  if (state.red >= 30) win = 'RED TEAM THẮNG!';
  document.querySelector('#winner').textContent = win;
  document.querySelector('#final').textContent = 'Tỉ số cuối: BLUE ' + state.blue + ' — ' + state.red + ' RED';
}

function score(team, killer, victim) {
  state[team]++;
  feed((team === 'blue' ? 'BLUE' : 'RED') + ' +1 | ' + killer + ' hạ ' + victim);
  if (state[team] >= 30) endGame();
}

function hitFeedback() {
  damageFxEl.classList.remove('show');
  hurtVignetteEl.classList.remove('show');
  void damageFxEl.offsetWidth;
  void hurtVignetteEl.offsetWidth;
  damageFxEl.classList.add('show');
  hurtVignetteEl.classList.add('show');
  damageShake = 0.22;
  const now = performance.now();
  if (now - lastDamageNotice > 300) {
    feed('BỊ BẮN TRÚNG!');
    lastDamageNotice = now;
  }
}

function respawnPlayer() {
  hp = 100;
  ammo = 30;
  reserve = 120;
  reloading = false;
  camera.position.set(playerSpawn[0], playerSpawn[1], playerSpawn[2]);
  respawnAt = 0;
  feed('Bạn đã hồi sinh');
}

function killPlayer(killer) {
  if (respawnAt) return;
  hp = 0;
  hitFeedback();
  respawnAt = performance.now() + 4000;
  score('red', 'RED-' + (killer.i + 1), 'Bạn');
  feed('Bạn bị hạ — hồi sinh sau 4 giây');
}

function reload() {
  if (!started || gameOver || reloading || ammo >= 30 || reserve <= 0) return;
  reloading = true;
  setTimeout(() => {
    const n = Math.min(30 - ammo, reserve);
    ammo += n;
    reserve -= n;
    reloading = false;
  }, 900);
}

const ray = new THREE.Raycaster();

function tracer(from, to, color = 0xffd36a, life = 75) {
  const geo = new THREE.BufferGeometry().setFromPoints([from.clone(), to.clone()]);
  const mat = new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.92 });
  const line = new THREE.Line(geo, mat);
  scene.add(line);
  setTimeout(() => {
    scene.remove(line);
    geo.dispose();
    mat.dispose();
  }, life);
}

function impact(point, color = 0xffc65a) {
  const group = new THREE.Group();
  const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.95 });
  for (let i = 0; i < 7; i++) {
    const p = new THREE.Mesh(new THREE.SphereGeometry(0.035 + Math.random() * 0.025, 6, 6), mat);
    const a = Math.random() * Math.PI * 2;
    const d = 0.3 + Math.random() * 0.5;
    p.position.set(Math.cos(a) * d, (Math.random() - 0.5) * 0.35, Math.sin(a) * d);
    group.add(p);
  }
  group.position.copy(point);
  scene.add(group);
  const start = performance.now();
  function animate(now) {
    const t = Math.min(1, (now - start) / 180);
    group.scale.setScalar(1 + 0.8 * t);
    mat.opacity = 1 - t;
    if (t < 1) requestAnimationFrame(animate);
    else {
      scene.remove(group);
      mat.dispose();
      group.children.forEach(p => p.geometry.dispose());
    }
  }
  requestAnimationFrame(animate);
}

function showHit() {
  hitMarkerEl.style.opacity = '1';
  clearTimeout(showHit.timer);
  showHit.timer = setTimeout(() => { hitMarkerEl.style.opacity = '0'; }, 100);
}

function showMuzzle() {
  muzzleFlashEl.classList.remove('show');
  void muzzleFlashEl.offsetWidth;
  muzzleFlashEl.classList.add('show');
  muzzleOrb.material.opacity = 0.95;
  clearTimeout(showMuzzle.timer);
  showMuzzle.timer = setTimeout(() => { muzzleOrb.material.opacity = 0; }, 55);
}

function botDamage(target, damage, team, killerName) {
  if (!target || !target.alive) return;
  target.hp = Math.max(0, target.hp - damage);
  if (target.hp <= 0) {
    target.alive = false;
    target.respawn = performance.now() + 4000;
    target.g.visible = false;
    score(team, killerName, target.team.toUpperCase() + '-' + (target.i + 1));
  }
}

// Static collision definitions are used for every movement step.
function circleIntersectsAABB(x, z, radius, c) {
  const nearX = Math.max(c.minX, Math.min(x, c.maxX));
  const nearZ = Math.max(c.minZ, Math.min(z, c.maxZ));
  const dx = x - nearX;
  const dz = z - nearZ;
  return dx * dx + dz * dz < radius * radius;
}

function canOccupy(x, z, radius, selfBot = null) {
  if (x < -59.8 + radius || x > 59.8 - radius || z < -41.8 + radius || z > 41.8 - radius) return false;
  for (const c of colliders) {
    if (c.maxY < 0.3 || c.minY > 2.25) continue;
    if (circleIntersectsAABB(x, z, radius, c)) return false;
  }
  for (const other of bots) {
    if (!other.alive || other === selfBot) continue;
    const dx = x - other.g.position.x;
    const dz = z - other.g.position.z;
    if (dx * dx + dz * dz < (radius + 0.42) * (radius + 0.42)) return false;
  }
  return true;
}

function moveWithCollision(pos, dx, dz, radius, selfBot = null) {
  const steps = Math.max(1, Math.ceil(Math.max(Math.abs(dx), Math.abs(dz)) / 0.12));
  const sx = dx / steps;
  const sz = dz / steps;
  for (let i = 0; i < steps; i++) {
    if (canOccupy(pos.x + sx, pos.z, radius, selfBot)) pos.x += sx;
    if (canOccupy(pos.x, pos.z + sz, radius, selfBot)) pos.z += sz;
  }
}

function hasLineOfSight(fromPos, toPos) {
  const origin = fromPos.clone();
  origin.y = fromPos.y > 0.5 ? Math.min(fromPos.y, 1.8) : 1.35;
  const target = toPos.clone();
  target.y = toPos.y > 0.5 ? Math.min(toPos.y, 1.8) : 1.35;
  const direction = target.clone().sub(origin);
  const distance = direction.length();
  if (distance < 0.1) return true;
  direction.normalize();
  scene.updateMatrixWorld(true);
  ray.set(origin, direction);
  const hits = ray.intersectObjects(blockers, false);
  return !hits.length || hits[0].distance >= distance - 0.35;
}

function getEnemies(bot) {
  if (bot.team === 'blue') {
    return bots.filter(b => b.alive && b.team === 'red').map(b => ({
      player: false, bot: b, pos: b.g.position, dist: bot.g.position.distanceTo(b.g.position)
    }));
  }
  const enemies = bots.filter(b => b.alive && b.team === 'blue').map(b => ({
    player: false, bot: b, pos: b.g.position, dist: bot.g.position.distanceTo(b.g.position)
  }));
  enemies.push({ player: true, bot: null, pos: camera.position, dist: bot.g.position.distanceTo(camera.position) });
  return enemies;
}

function chooseMoveTarget(bot) {
  const enemies = getEnemies(bot);
  if (!enemies.length) return null;
  enemies.sort((a, b) => {
    const aCost = a.dist + (bot.team === 'red' && a.player ? 9 : 0) + Math.random() * 8;
    const bCost = b.dist + (bot.team === 'red' && b.player ? 9 : 0) + Math.random() * 8;
    return aCost - bCost;
  });
  return enemies[0];
}

function chooseShootTarget(bot) {
  const enemies = getEnemies(bot)
    .filter(e => e.dist < 47 && hasLineOfSight(bot.g.position, e.pos));
  if (!enemies.length) return null;
  enemies.sort((a, b) => {
    const aCost = a.dist + (bot.team === 'red' && a.player ? 9 : 0) + Math.random() * 5;
    const bCost = b.dist + (bot.team === 'red' && b.player ? 9 : 0) + Math.random() * 5;
    return aCost - bCost;
  });
  return enemies[0];
}

function fireBotWeapon(bot, dt) {
  bot.fire -= dt;
  if (bot.fire > 0 || !bot.alive) return;
  bot.fire = 0.75 + Math.random() * 0.85;

  const target = chooseShootTarget(bot);
  if (!target) return;
  const dx = target.pos.x - bot.g.position.x;
  const dz = target.pos.z - bot.g.position.z;
  bot.g.rotation.y = Math.atan2(dx, dz);

  const from = bot.g.position.clone();
  from.y = 1.35;
  const to = target.pos.clone();
  to.y = target.player ? 1.65 : 1.3;
  tracer(from, to, bot.team === 'red' ? 0xff5c66 : 0x4fb5ff, 95);

  // A visible tracer may miss. Cover/line-of-sight is checked above before damage is allowed.
  if (Math.random() > (bot.team === 'red' ? 0.55 : 0.60)) return;
  if (target.player) {
    hp = Math.max(0, hp - 14);
    hitFeedback();
    if (hp <= 0) killPlayer(bot);
  } else {
    impact(to, bot.team === 'red' ? 0xff6670 : 0x66b8ff);
    botDamage(target.bot, 27, bot.team, bot.team.toUpperCase() + '-' + (bot.i + 1));
  }
}

function shoot() {
  if (!started || gameOver || reloading || respawnAt || shootCD > 0) return;
  if (ammo <= 0) { reload(); return; }

  ammo--;
  shootCD = 0.13;
  showMuzzle();

  // Capture the true crosshair direction first; recoil is visual only.
  scene.updateMatrixWorld(true);
  ray.setFromCamera(new THREE.Vector2(0, 0), camera);
  const enemyMeshes = bots.filter(b => b.alive && b.team === 'red').flatMap(b => [b.body, b.head]);
  const enemyHit = ray.intersectObjects(enemyMeshes, false)[0] || null;
  const worldHit = ray.intersectObjects(blockers, false)[0] || null;
  const maximum = 80;
  let end = ray.ray.origin.clone().add(ray.ray.direction.clone().multiplyScalar(maximum));

  if (worldHit && (!enemyHit || worldHit.distance <= enemyHit.distance)) {
    end = worldHit.point.clone();
    impact(end, 0x8ea0b5);
  } else if (enemyHit) {
    end = enemyHit.point.clone();
    const target = enemyHit.object.userData.bot;
    if (target && target.alive) {
      impact(end, 0xffc65a);
      showHit();
      botDamage(target, enemyHit.object.userData.isHead ? 60 : 40, 'blue', 'Bạn');
    }
  }
  tracer(ray.ray.origin, end);

  camera.rotation.x = Math.max(-1.45, Math.min(1.45, pitch - 0.035));
  setTimeout(() => { if (started && !gameOver) camera.rotation.x = pitch; }, 55);
}

renderer.domElement.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  if (document.pointerLockElement !== renderer.domElement) renderer.domElement.requestPointerLock();
  shoot();
});

addEventListener('mousemove', e => {
  if (document.pointerLockElement !== renderer.domElement || !started) return;
  yaw -= e.movementX * 0.0022;
  pitch -= e.movementY * 0.0022;
  pitch = Math.max(-1.45, Math.min(1.45, pitch));
  camera.rotation.set(pitch, yaw, 0);
});

function movePlayer(dt) {
  if (respawnAt) return;
  const localX = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
  const localZ = (keys.KeyS ? 1 : 0) - (keys.KeyW ? 1 : 0);
  if (!localX && !localZ) return;
  const direction = new THREE.Vector3(localX, 0, localZ).normalize().applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
  const speed = keys.ShiftLeft || keys.ShiftRight ? 9.5 : 5.6;
  moveWithCollision(camera.position, direction.x * speed * dt, direction.z * speed * dt, 0.46, null);
  camera.position.y = 1.7;
}

function moveBot(bot, dt) {
  if (!bot.moveTarget || !bot.moveTarget.player && !bot.moveTarget.bot.alive || bot.retargetIn <= 0) {
    bot.moveTarget = chooseMoveTarget(bot);
    bot.retargetIn = 1.2 + Math.random() * 1.4;
  }
  bot.retargetIn -= dt;

  const target = bot.moveTarget;
  if (!target) return;
  const p = target.player ? camera.position : target.bot.g.position;
  const dx = p.x - bot.g.position.x;
  const dz = p.z - bot.g.position.z;
  const distance = Math.hypot(dx, dz);
  if (distance < 0.01) return;

  bot.g.rotation.y = Math.atan2(dx, dz);
  if (distance < 7.2) {
    bot.path += dt;
    const side = Math.sin(bot.path * 1.9) >= 0 ? 1 : -1;
    const angle = Math.atan2(dz, dx) + side * Math.PI / 2;
    moveWithCollision(bot.g.position, Math.cos(angle) * dt * 1.3, Math.sin(angle) * dt * 1.3, 0.48, bot);
    return;
  }

  const angle = Math.atan2(dz, dx);
  const step = 2.0 * dt;
  const directions = [
    angle,
    angle + Math.PI / 3,
    angle - Math.PI / 3,
    angle + Math.PI / 2,
    angle - Math.PI / 2,
    angle + Math.PI
  ];
  for (const a of directions) {
    const dxTry = Math.cos(a) * step;
    const dzTry = Math.sin(a) * step;
    const oldX = bot.g.position.x;
    const oldZ = bot.g.position.z;
    moveWithCollision(bot.g.position, dxTry, dzTry, 0.48, bot);
    if (Math.hypot(bot.g.position.x - oldX, bot.g.position.z - oldZ) > 0.002) break;
  }
}

function updateBots(dt) {
  for (const bot of bots) {
    if (!bot.alive) {
      if (performance.now() >= bot.respawn) {
        bot.alive = true;
        bot.hp = 100;
        bot.g.visible = true;
        const p = bot.team === 'blue' ? blueSpawn[bot.i] : redSpawn[bot.i];
        bot.g.position.set(p[0], p[1], p[2]);
        bot.fire = 0.5 + Math.random();
        bot.moveTarget = null;
        bot.retargetIn = 0;
      }
      continue;
    }

    const ratio = Math.max(0, bot.hp / 100);
    bot.hpFill.scale.x = ratio;
    bot.hpFill.position.x = -(1.27 * (1 - ratio)) / 2;
    bot.hpFill.visible = bot.alive && ratio > 0;
    bot.hpBack.visible = bot.alive;
    // Make floating health bars face the camera.
    bot.hpBack.rotation.y = yaw - bot.g.rotation.y;
    bot.hpFill.rotation.y = yaw - bot.g.rotation.y;

    moveBot(bot, dt);
    fireBotWeapon(bot, dt);
  }
}

function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.04, (now - last) / 1000);
  last = now;

  if (damageShake > 0) {
    damageShake = Math.max(0, damageShake - dt);
    camera.rotation.z = Math.sin(now * 0.09) * damageShake * 0.45;
  } else {
    camera.rotation.z = 0;
  }

  if (started && !gameOver) {
    timeLeft -= dt;
    if (timeLeft <= 0) endGame();
    shootCD = Math.max(0, shootCD - dt);
    if (respawnAt && performance.now() >= respawnAt) respawnPlayer();
    movePlayer(dt);
    updateBots(dt);
    updateUI();
  }

  renderer.render(scene, camera);
}
loop(performance.now());

document.querySelector('#startBtn').onclick = () => {
  started = true;
  document.querySelector('#start').style.display = 'none';
  renderer.domElement.requestPointerLock();
  last = performance.now();
};
document.querySelector('#restart').onclick = () => location.reload();
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script></body></html>
