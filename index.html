<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Strike Five — FPS 5v5</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b10;font-family:Inter,system-ui,Arial,sans-serif;color:#fff}canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}#top{display:flex;justify-content:center;gap:18px;padding:16px;font-weight:800;font-size:20px;text-shadow:0 2px 5px #000}
.score{padding:7px 14px;border-radius:10px;background:#101722d9;border:1px solid #ffffff20}.blue{color:#55aaff}.red{color:#ff6464}
#cross{position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%)}.crossH{position:absolute;left:0;top:10px;width:22px;height:2px;background:#fff;box-shadow:0 0 4px #000}.crossV{position:absolute;left:10px;top:0;width:2px;height:22px;background:#fff;box-shadow:0 0 4px #000}#hitMarker{position:absolute;left:50%;top:50%;width:30px;height:30px;transform:translate(-50%,-50%) rotate(45deg);opacity:0;transition:opacity .08s}#hitMarker::before,#hitMarker::after{content:"";position:absolute;left:14px;top:2px;width:2px;height:26px;background:#ffdf6b;box-shadow:0 0 8px #ffb000}#hitMarker::after{transform:rotate(90deg)}#muzzleFlash{position:absolute;left:50%;top:50%;width:180px;height:180px;transform:translate(-20%,-20%);border-radius:50%;background:radial-gradient(circle,rgba(255,245,180,.95) 0%,rgba(255,172,45,.62) 12%,rgba(255,80,10,.18) 34%,transparent 65%);mix-blend-mode:screen;opacity:0;pointer-events:none}#muzzleFlash.show{animation:mflash .08s ease-out}@keyframes mflash{0%{opacity:1;transform:translate(-20%,-20%) scale(.6)}100%{opacity:0;transform:translate(-20%,-20%) scale(1.25)}}
#health{position:absolute;left:20px;bottom:62px;width:230px;font-size:18px;background:#101722d9;padding:9px 13px;border-radius:10px;border:1px solid #ffffff20}.hpBar{width:100%;height:12px;margin-top:7px;border-radius:8px;background:#27313d;overflow:hidden;box-shadow:inset 0 0 0 1px #ffffff18}.hpFill{height:100%;width:100%;border-radius:8px;background:linear-gradient(90deg,#47d66b,#a5f26b);transform-origin:left center;transition:width .12s ease,background .12s ease}#damageFx{position:fixed;inset:0;z-index:8;pointer-events:none;background:radial-gradient(circle,transparent 35%,rgba(255,50,50,.18) 68%,rgba(255,30,30,.72) 100%);opacity:0}#damageFx.show{animation:damageFlash .42s ease-out}@keyframes damageFlash{0%{opacity:1}35%{opacity:.72}100%{opacity:0}}#hurtVignette{position:fixed;inset:0;z-index:7;pointer-events:none;opacity:0;box-shadow:inset 0 0 120px rgba(255,30,30,.8)}#hurtVignette.show{animation:vignette .5s ease-out}@keyframes vignette{0%{opacity:1}100%{opacity:0}}#ammo{position:absolute;right:20px;bottom:20px;font-size:25px;font-weight:800;background:#101722d9;padding:9px 13px;border-radius:10px}
#feed{position:absolute;right:20px;top:70px;width:310px;text-align:right;font-size:14px}.kill{margin:4px 0;text-shadow:0 2px 4px #000}
#start,#end{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#172438dd,#05070bd9);text-align:center}.panel{max-width:620px;padding:34px;border:1px solid #ffffff22;border-radius:18px;background:#0c111bd9;box-shadow:0 20px 70px #000}
h1{font-size:44px;margin:0 0 8px}p{line-height:1.6;color:#b9c5d4}button{pointer-events:auto;border:0;border-radius:10px;padding:12px 22px;font-size:16px;font-weight:800;cursor:pointer;background:#4da3ff;color:#06101d}#end{display:none}.small{font-size:13px;color:#8492a5}
</style>
</head>
<body>
<div id="start"><div class="panel"><h1>STRIKE FIVE</h1><p>FPS đối kháng 5v5. Đội nào đạt <b>30 mạng</b> trước sẽ thắng.</p><p><b>WASD</b> di chuyển · <b>Chuột</b> ngắm/bắn · <b>R</b> nạp đạn · <b>Shift</b> chạy nhanh · <b>ESC</b> mở chuột</p><p class="small">Prototype: bạn đấu cùng 4 đồng đội AI với 5 bot đối phương.</p><button id="startBtn">VÀO TRẬN</button></div></div>
<div id="end"><div class="panel"><h1 id="winner"></h1><p id="final"></p><button id="restart">CHƠI LẠI</button></div></div>
<div id="damageFx"></div><div id="hurtVignette"></div><div id="hud"><div id="top"><span class="score blue" id="blueScore">BLUE 0</span><span class="score" id="timer">02:00</span><span class="score red" id="redScore">RED 0</span></div><div id="cross"><span class="crossH"></span><span class="crossV"></span></div><div id="hitMarker"></div><div id="muzzleFlash"></div><div id="health">HP 100<div class="hpBar"><div id="hpFill" class="hpFill"></div></div></div><div id="ammo">30 / 120</div><div id="feed"></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x09101a);scene.fog=new THREE.Fog(0x09101a,35,105);
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.05,150);camera.rotation.order='YXZ';
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xbddcff,0x20252b,2.1));const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(20,35,10);sun.castShadow=true;scene.add(sun);
const solids=[];function box(x,y,z,sx,sy,sz,color){const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),new THREE.MeshStandardMaterial({color:color||0x394554,roughness:.85}));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);solids.push(m);return m}
box(0,-.5,0,122,1,86,0x1c2631);box(0,3,-43,122,7,1,0x202b38);box(0,3,43,122,7,1,0x202b38);box(-61,3,0,1,7,86,0x202b38);box(61,3,0,1,7,86,0x202b38);
[[-22,2,-15,12,4,3],[22,2,15,12,4,3],[-8,2,16,4,4,10],[8,2,-16,4,4,10],[-38,1,13,8,2,4],[38,1,-13,8,2,4],[-1,1,0,6,2,6],[-30,1,-8,5,2,3],[30,1,8,5,2,3]].forEach(v=>box(...v,0x344453));
for(let x=-48;x<=48;x+=8)if(Math.abs(x)>8)box(x,1.5,0,2,3,2,0x2b3946);
const obstacles=solids.slice(1);
const keys={};addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyR')reload()});addEventListener('keyup',e=>keys[e.code]=false);
let started=false,gameOver=false,timeLeft=120,last=performance.now(),yaw=0,pitch=0,hp=100,ammo=30,reserve=120,reloading=false,shootCD=0,respawnAt=0;
const blueScoreEl=document.querySelector('#blueScore'),redScoreEl=document.querySelector('#redScore'),timerEl=document.querySelector('#timer'),healthEl=document.querySelector('#health'),hpFillEl=document.querySelector('#hpFill'),ammoEl=document.querySelector('#ammo'),feedEl=document.querySelector('#feed'),hitMarkerEl=document.querySelector('#hitMarker'),muzzleFlashEl=document.querySelector('#muzzleFlash'),damageFxEl=document.querySelector('#damageFx'),hurtVignetteEl=document.querySelector('#hurtVignette');let damageShake=0,lastDamageFx=0;const bots=[];const blueSpawn=[[-52,0,-24],[-52,0,-12],[-52,0,0],[-52,0,12],[-52,0,24]],redSpawn=[[52,0,24],[52,0,12],[52,0,0],[52,0,-12],[52,0,-24]];const state={blue:0,red:0};
function bot(team,i){const g=new THREE.Group();const hpBack=new THREE.Mesh(new THREE.PlaneGeometry(1.35,.12),new THREE.MeshBasicMaterial({color:0x11151b,transparent:true,opacity:.88,depthWrite:false}));hpBack.position.set(0,2.65,0);g.add(hpBack);const hpFill=new THREE.Mesh(new THREE.PlaneGeometry(1.28,.075),new THREE.MeshBasicMaterial({color:team==='blue'?0x4fc3ff:0xff565f,depthWrite:false}));hpFill.position.set(0,2.65,.01);g.add(hpFill);const body=new THREE.Mesh(new THREE.BoxGeometry(.8,1.2,.55),new THREE.MeshStandardMaterial({color:team==='blue'?0x2686df:0xd63d49}));body.position.y=1.2;body.castShadow=true;g.add(body);const head=new THREE.Mesh(new THREE.BoxGeometry(.55,.55,.55),new THREE.MeshStandardMaterial({color:0xc9a37a}));head.position.y=2.05;head.castShadow=true;g.add(head);g.position.set(...(team==='blue'?blueSpawn[i]:redSpawn[i]));scene.add(g);const b={g,team,i,hp:100,alive:true,respawn:0,fire:Math.random()*1.5,path:Math.random()*6.28,hpBack,hpFill,body,head};body.userData.bot=b;head.userData.bot=b;return b}
for(let i=0;i<4;i++)bots.push(bot('blue',i));for(let i=0;i<5;i++)bots.push(bot('red',i));
const weapon=new THREE.Group();
const gunMat=new THREE.MeshStandardMaterial({color:0x20242b,roughness:.55,metalness:.55});
const gunBody=new THREE.Mesh(new THREE.BoxGeometry(.32,.18,.72),gunMat);gunBody.position.set(.31,-.25,-1.05);gunBody.castShadow=true;weapon.add(gunBody);
const grip=new THREE.Mesh(new THREE.BoxGeometry(.14,.34,.15),gunMat);grip.position.set(.30,-.43,-.91);grip.rotation.x=-.18;weapon.add(grip);
const barrel=new THREE.Mesh(new THREE.CylinderGeometry(.045,.055,.66,10),gunMat);barrel.position.set(.31,-.20,-1.42);barrel.rotation.x=Math.PI/2;weapon.add(barrel);
const sight=new THREE.Mesh(new THREE.BoxGeometry(.06,.07,.18),gunMat);sight.position.set(.31,-.13,-1.14);weapon.add(sight);
const muzzleOrb=new THREE.Mesh(new THREE.SphereGeometry(.07,10,10),new THREE.MeshBasicMaterial({color:0xffcf5b,transparent:true,opacity:0}));muzzleOrb.position.set(.31,-.20,-1.76);weapon.add(muzzleOrb);
camera.add(weapon);
function flash(msg){const d=document.createElement('div');d.className='kill';d.textContent=msg;feedEl.prepend(d);setTimeout(()=>d.remove(),2200)}
function updateUI(){blueScoreEl.textContent='BLUE '+state.blue;redScoreEl.textContent='RED '+state.red;const curHp=Math.max(0,Math.round(hp));healthEl.firstChild.textContent='HP '+curHp;hpFillEl.style.width=curHp+'%';hpFillEl.style.background=curHp<=30?'linear-gradient(90deg,#ff4141,#ff8a62)':curHp<=60?'linear-gradient(90deg,#ff9f43,#ffe066)':'linear-gradient(90deg,#47d66b,#a5f26b)';ammoEl.textContent=reloading?'NẠP ĐẠN...':ammo+' / '+reserve;timerEl.textContent=String(Math.max(0,Math.floor(timeLeft/60))).padStart(2,'0')+':'+String(Math.max(0,Math.ceil(timeLeft%60))).padStart(2,'0')}
function endGame(){if(gameOver)return;gameOver=true;document.exitPointerLock();document.querySelector('#end').style.display='flex';const win=state.blue>=30?'BLUE':state.red>=30?'RED':state.blue>state.red?'BLUE':'RED';document.querySelector('#winner').textContent=win+' TEAM THẮNG!';document.querySelector('#final').textContent='Tỉ số cuối: BLUE '+state.blue+' — '+state.red+' RED'}
function score(team,killer,victim){state[team]++;flash((team==='blue'?'BLUE':'RED')+' +1 | '+killer+' hạ '+victim);if(state[team]>=30)endGame()}
function respawnPlayer(){hp=100;ammo=30;reserve=120;reloading=false;const p=blueSpawn[Math.floor(Math.random()*blueSpawn.length)];camera.position.set(p[0],1.7,p[2]);respawnAt=0;flash('Bạn đã hồi sinh')}
function playerHitEffect(){damageFxEl.classList.remove('show');hurtVignetteEl.classList.remove('show');void damageFxEl.offsetWidth;void hurtVignetteEl.offsetWidth;damageFxEl.classList.add('show');hurtVignetteEl.classList.add('show');damageShake=.22;const now=performance.now();if(now-lastDamageFx>280){lastDamageFx=now;flash('BỊ BẮN TRÚNG!')}}
function killPlayer(killer){if(respawnAt)return;hp=0;respawnAt=performance.now()+4000;score('red',killer,'Bạn');flash('Bạn bị hạ — hồi sinh sau 4 giây')}
function reload(){if(!started||gameOver||reloading||ammo>=30||reserve<=0)return;reloading=true;setTimeout(()=>{const n=Math.min(30-ammo,reserve);ammo+=n;reserve-=n;reloading=false},900)}
const ray=new THREE.Raycaster();
function tracer(from,to,color=0xffd36a,life=75){const geo=new THREE.BufferGeometry().setFromPoints([from.clone(),to.clone()]);const mat=new THREE.LineBasicMaterial({color,transparent:true,opacity:.92});const line=new THREE.Line(geo,mat);scene.add(line);setTimeout(()=>{scene.remove(line);geo.dispose();mat.dispose()},life);return line}
function impact(point,color=0xffc65a){const g=new THREE.Group();const mat=new THREE.MeshBasicMaterial({color,transparent:true,opacity:.95});for(let i=0;i<7;i++){const p=new THREE.Mesh(new THREE.SphereGeometry(.035+Math.random()*.025,6,6),mat);const a=Math.random()*Math.PI*2;const h=.3+Math.random()*.5;p.position.set(Math.cos(a)*h,(Math.random()-.5)*.35,Math.sin(a)*h);g.add(p)}g.position.copy(point);scene.add(g);const t=performance.now();function anim(now){const k=Math.min(1,(now-t)/180);g.scale.setScalar(1+.8*k);mat.opacity=1-k;if(k<1)requestAnimationFrame(anim);else{scene.remove(g);mat.dispose();g.children.forEach(x=>x.geometry.dispose())}}requestAnimationFrame(anim)}
function showHit(){hitMarkerEl.style.opacity='1';clearTimeout(showHit.t);showHit.t=setTimeout(()=>hitMarkerEl.style.opacity='0',90)}
function showMuzzle(){muzzleFlashEl.classList.remove('show');void muzzleFlashEl.offsetWidth;muzzleFlashEl.classList.add('show');muzzleOrb.material.opacity=.95;clearTimeout(showMuzzle.t);showMuzzle.t=setTimeout(()=>muzzleOrb.material.opacity=0,55)}
function botDamage(target,damage,team,killerName){target.hp-=damage;if(target.hp<=0){target.alive=false;target.respawn=performance.now()+4000;target.g.visible=false;score(team,killerName,target.team.toUpperCase()+'-'+(target.i+1))}}
function shoot(){if(!started||gameOver||reloading||respawnAt||shootCD>0)return;if(ammo<=0){reload();return}ammo--;shootCD=.13;showMuzzle();camera.rotation.x=Math.max(-1.45,Math.min(1.45,pitch-.035));setTimeout(()=>{if(started&&!gameOver)camera.rotation.x=pitch},55);ray.setFromCamera(new THREE.Vector2(0,0),camera);const enemyMeshes=bots.filter(b=>b.alive&&b.team==='red').flatMap(b=>[b.body,b.head]);const hits=ray.intersectObjects([...solids,...enemyMeshes],false);let end=ray.ray.origin.clone().add(ray.ray.direction.clone().multiplyScalar(70));if(hits.length){end=hits[0].point.clone();const b=hits[0].object.userData.bot;if(b){impact(end,0xffc65a);showHit();const dmg=hits[0].object===b.head?50:34;botDamage(b,dmg,'blue','Bạn')}else{impact(end,0x8ea0b5)}}tracer(ray.ray.origin,end);}
renderer.domElement.addEventListener('mousedown',e=>{if(e.button===0){if(document.pointerLockElement!==renderer.domElement)renderer.domElement.requestPointerLock();shoot()}});
addEventListener('mousemove',e=>{if(document.pointerLockElement!==renderer.domElement||!started)return;yaw-=e.movementX*.0022;pitch-=e.movementY*.0022;pitch=Math.max(-1.45,Math.min(1.45,pitch));camera.rotation.set(pitch,yaw,0)});
function blocked(x,z,r=.48,self=null){for(const m of obstacles){const bb=new THREE.Box3().setFromObject(m);if(bb.max.y<.5||bb.min.y>2.2)continue;const cx=Math.max(bb.min.x,Math.min(x,bb.max.x)),cz=Math.max(bb.min.z,Math.min(z,bb.max.z));if((x-cx)*(x-cx)+(z-cz)*(z-cz)<r*r)return true}for(const b of bots){if(!b.alive||b===self)continue;const dx=x-b.g.position.x,dz=z-b.g.position.z;if(dx*dx+dz*dz<(r+.42)*(r+.42))return true}return false}
function hasLineOfSight(from,to){const a=from.clone();a.y=1.25;const t=to.clone();t.y=1.25;const dir=t.clone().sub(a),dist=dir.length();if(dist<=.01)return true;dir.normalize();ray.set(a,dir);const hits=ray.intersectObjects(obstacles,false);return !hits.length||hits[0].distance>dist-.15}
function movePlayer(dt){if(respawnAt)return;const dir=new THREE.Vector3((keys.KeyD?1:0)-(keys.KeyA?1:0),0,(keys.KeyS?1:0)-(keys.KeyW?1:0));if(!dir.length())return;dir.normalize().applyAxisAngle(new THREE.Vector3(0,1,0),yaw);const step=(keys.ShiftLeft?10:6)*dt;let nx=camera.position.x+dir.x*step,nz=camera.position.z+dir.z*step;if(nx>-59&&nx<59&&nz>-41&&nz<41&&!blocked(nx,nz,.45))camera.position.set(nx,1.7,nz)}
function chooseTarget(b){const enemies=b.team==='red'?[{player:true,pos:camera.position,name:'Bạn',dist:b.g.position.distanceTo(camera.position)}].concat(bots.filter(x=>x.alive&&x.team==='blue').map(x=>({player:false,bot:x,pos:x.g.position,name:'BLUE-'+(x.i+1),dist:b.g.position.distanceTo(x.g.position)}))):bots.filter(x=>x.alive&&x.team==='red').map(x=>({player:false,bot:x,pos:x.g.position,name:'RED-'+(x.i+1),dist:b.g.position.distanceTo(x.g.position)}));const visible=enemies.filter(e=>e.dist<48&&hasLineOfSight(b.g.position,e.pos));if(!visible.length)return enemies.sort((a,c)=>a.dist-c.dist)[0]||null;visible.sort((a,c)=>(a.dist+(a.player?4:0)+Math.random()*7)-(c.dist+(c.player?4:0)+Math.random()*7));return visible[0]}
function botFire(b,dt){if(!b.alive)return;b.fire-=dt;if(b.fire>0)return;const target=chooseTarget(b);if(!target){b.fire=.8;return}b.fire=.65+Math.random()*1.05;if(target.dist>48||!hasLineOfSight(b.g.position,target.pos))return;const dx=target.pos.x-b.g.position.x,dz=target.pos.z-b.g.position.z,d=Math.hypot(dx,dz);if(!d)return;const accuracy=b.team==='red'?.62:.72;const aim=Math.atan2(dx,dz),targetYaw=Math.atan2(dx,dz);const facing=b.g.rotation.y;const diff=Math.atan2(Math.sin(targetYaw-facing),Math.cos(targetYaw-facing));if(Math.abs(diff)<.6&&Math.random()<accuracy){const from=b.g.position.clone();from.y=1.25;const to=target.pos.clone();to.y=1.25;tracer(from,to,b.team==='red'?0xff5c66:0x4fb5ff,95);if(target.player){hp-=18;playerHitEffect();if(hp<=0)killPlayer('RED-'+(b.i+1))}else{impact(to,b.team==='red'?0xff6670:0x66b8ff);botDamage(target.bot,b.team==='red'?22:26,b.team,b.team.toUpperCase()+'-'+(b.i+1))}}}
function updateBots(dt){for(const b of bots){if(!b.alive){if(performance.now()>=b.respawn){b.alive=true;b.hp=100;b.g.visible=true;b.hpBack.visible=true;b.hpFill.visible=true;b.hpFill.scale.x=1;b.hpFill.position.x=0;const p=b.team==='blue'?blueSpawn[b.i]:redSpawn[b.i];b.g.position.set(p[0],0,p[2])}continue}const enemies=b.team==='blue'?bots.filter(x=>x.alive&&x.team==='red'):[...bots.filter(x=>x.alive&&x.team==='blue'),{g:{position:camera.position},alive:true}];let target;if(b.team==='red'){const candidates=[{player:true,pos:camera.position,name:'Bạn',dist:b.g.position.distanceTo(camera.position)}].concat(enemies.filter(x=>x.g).map(x=>({player:false,bot:x,pos:x.g.position,name:'BLUE-'+(x.i+1),dist:b.g.position.distanceTo(x.g.position)})));target=candidates.sort((a,c)=>a.dist+(a.player?4:0)+Math.random()*7-(c.dist+(c.player?4:0)+Math.random()*7))[0]||null}else{target=enemies.length?enemies.reduce((a,c)=>b.g.position.distanceTo(c.g.position)<b.g.position.distanceTo(a.g.position)?c:a).g.position:camera.position}const tx=target&&target.pos?target.pos.x:target.x,tz=target&&target.pos?target.pos.z:target.z;const dx=tx-b.g.position.x,dz=tz-b.g.position.z,d=Math.hypot(dx,dz);if(d>7){const a=Math.atan2(dz,dx);const step=2.2*dt;const options=[[Math.cos(a),Math.sin(a)],[Math.cos(a+Math.PI/2),Math.sin(a+Math.PI/2)],[Math.cos(a-Math.PI/2),Math.sin(a-Math.PI/2)]];let moved=false;for(const [mx,mz] of options){const nx=b.g.position.x+mx*step,nz=b.g.position.z+mz*step;if(nx>-57&&nx<57&&nz>-40&&nz<40&&!blocked(nx,nz,.46,b)){b.g.position.x=nx;b.g.position.z=nz;moved=true;break}}if(!moved)b.path+=1.7*dt}else{b.path+=dt*(Math.random()>.5?1:-1);const nx=b.g.position.x+Math.cos(b.path)*dt*.8,nz=b.g.position.z+Math.sin(b.path)*dt*.8;if(!blocked(nx,nz,.46,b)){b.g.position.x=nx;b.g.position.z=nz}}b.g.position.x=Math.max(-57,Math.min(57,b.g.position.x));b.g.position.z=Math.max(-40,Math.min(40,b.g.position.z));const ratio=Math.max(0,b.hp/100);b.hpFill.scale.x=ratio;b.hpFill.position.x=-(1.28*(1-ratio))/2;b.hpFill.quaternion.copy(camera.quaternion);b.hpBack.quaternion.copy(camera.quaternion);b.hpFill.visible=b.alive&&ratio>0;b.hpBack.visible=b.alive;b.g.lookAt(tx,1.2,tz);botFire(b,dt)}}
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;if(damageShake>0){damageShake=Math.max(0,damageShake-dt);camera.rotation.z=Math.sin(now*.09)*damageShake*.45}else camera.rotation.z=0;if(started&&!gameOver){timeLeft-=dt;if(timeLeft<=0)endGame();shootCD=Math.max(0,shootCD-dt);if(respawnAt&&performance.now()>=respawnAt)respawnPlayer();movePlayer(dt);updateBots(dt);updateUI()}renderer.render(scene,camera)}loop(performance.now());
document.querySelector('#startBtn').onclick=()=>{started=true;document.querySelector('#start').style.display='none';renderer.domElement.requestPointerLock();last=performance.now()};document.querySelector('#restart').onclick=()=>location.reload();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
