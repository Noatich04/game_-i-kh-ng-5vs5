<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Strike Five — FPS 5v5</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b10;font-family:Inter,system-ui,Arial,sans-serif;color:#fff}canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}#top{display:flex;justify-content:center;gap:18px;padding:16px;font-weight:800;font-size:20px;text-shadow:0 2px 5px #000}
.score{padding:7px 14px;border-radius:10px;background:#101722d9;border:1px solid #ffffff20}.blue{color:#55aaff}.red{color:#ff6464}
#cross{position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%)}.crossH{position:absolute;left:0;top:10px;width:22px;height:2px;background:#fff;box-shadow:0 0 4px #000}.crossV{position:absolute;left:10px;top:0;width:2px;height:22px;background:#fff;box-shadow:0 0 4px #000}
#health{position:absolute;left:20px;bottom:20px;font-size:18px;background:#101722d9;padding:9px 13px;border-radius:10px;border:1px solid #ffffff20}#ammo{position:absolute;right:20px;bottom:20px;font-size:25px;font-weight:800;background:#101722d9;padding:9px 13px;border-radius:10px}
#feed{position:absolute;right:20px;top:70px;width:310px;text-align:right;font-size:14px}.kill{margin:4px 0;text-shadow:0 2px 4px #000}
#start,#end{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#172438dd,#05070bd9);text-align:center}.panel{max-width:620px;padding:34px;border:1px solid #ffffff22;border-radius:18px;background:#0c111bd9;box-shadow:0 20px 70px #000}
h1{font-size:44px;margin:0 0 8px}p{line-height:1.6;color:#b9c5d4}button{pointer-events:auto;border:0;border-radius:10px;padding:12px 22px;font-size:16px;font-weight:800;cursor:pointer;background:#4da3ff;color:#06101d}#end{display:none}.small{font-size:13px;color:#8492a5}
</style>
</head>
<body>
<div id="start"><div class="panel"><h1>STRIKE FIVE</h1><p>FPS đối kháng 5v5. Đội nào đạt <b>30 mạng</b> trước sẽ thắng.</p><p><b>WASD</b> di chuyển · <b>Chuột</b> ngắm/bắn · <b>R</b> nạp đạn · <b>Shift</b> chạy nhanh · <b>ESC</b> mở chuột</p><p class="small">Prototype: bạn đấu cùng 4 đồng đội AI với 5 bot đối phương.</p><button id="startBtn">VÀO TRẬN</button></div></div>
<div id="end"><div class="panel"><h1 id="winner"></h1><p id="final"></p><button id="restart">CHƠI LẠI</button></div></div>
<div id="hud"><div id="top"><span class="score blue" id="blueScore">BLUE 0</span><span class="score" id="timer">02:00</span><span class="score red" id="redScore">RED 0</span></div><div id="cross"><span class="crossH"></span><span class="crossV"></span></div><div id="health">HP 100</div><div id="ammo">30 / 120</div><div id="feed"></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x09101a);scene.fog=new THREE.Fog(0x09101a,35,105);
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.05,150);camera.rotation.order='YXZ';
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xbddcff,0x20252b,2.1));const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(20,35,10);sun.castShadow=true;scene.add(sun);
const solids=[];function box(x,y,z,sx,sy,sz,color){const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),new THREE.MeshStandardMaterial({color:color||0x394554,roughness:.85}));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);solids.push(m);return m}
box(0,-.5,0,82,1,58,0x1c2631);box(0,3,-29,82,7,1,0x202b38);box(0,3,29,82,7,1,0x202b38);box(-41,3,0,1,7,58,0x202b38);box(41,3,0,1,7,58,0x202b38);
[[-14,2,-8,10,4,3],[14,2,8,10,4,3],[-2,2,10,4,4,8],[2,2,-10,4,4,8],[-25,1,10,7,2,3],[25,1,-10,7,2,3],[0,1,0,5,2,5]].forEach(v=>box(...v,0x344453));
for(let x=-32;x<=32;x+=8)if(Math.abs(x)>4)box(x,1.5,0,2,3,2,0x2b3946);
const keys={};addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyR')reload()});addEventListener('keyup',e=>keys[e.code]=false);
let started=false,gameOver=false,timeLeft=120,last=performance.now(),yaw=0,pitch=0,hp=100,ammo=30,reserve=120,reloading=false,shootCD=0,respawnAt=0;
const blueScoreEl=document.querySelector('#blueScore'),redScoreEl=document.querySelector('#redScore'),timerEl=document.querySelector('#timer'),healthEl=document.querySelector('#health'),ammoEl=document.querySelector('#ammo'),feedEl=document.querySelector('#feed');const bots=[];const blueSpawn=[[-34,0,-16],[-34,0,-8],[-34,0,0],[-34,0,8],[-34,0,16]],redSpawn=[[34,0,16],[34,0,8],[34,0,0],[34,0,-8],[34,0,-16]];const state={blue:0,red:0};
function bot(team,i){const g=new THREE.Group();const body=new THREE.Mesh(new THREE.BoxGeometry(.8,1.2,.55),new THREE.MeshStandardMaterial({color:team==='blue'?0x2686df:0xd63d49}));body.position.y=1.2;body.castShadow=true;g.add(body);const head=new THREE.Mesh(new THREE.BoxGeometry(.55,.55,.55),new THREE.MeshStandardMaterial({color:0xc9a37a}));head.position.y=2.05;head.castShadow=true;g.add(head);g.position.set(...(team==='blue'?blueSpawn[i]:redSpawn[i]));scene.add(g);return{g,team,i,hp:100,alive:true,respawn:0,fire:Math.random()*1.5,path:Math.random()*6.28}}
for(let i=0;i<4;i++)bots.push(bot('blue',i));for(let i=0;i<5;i++)bots.push(bot('red',i));
function flash(msg){const d=document.createElement('div');d.className='kill';d.textContent=msg;feedEl.prepend(d);setTimeout(()=>d.remove(),2200)}
function updateUI(){blueScoreEl.textContent='BLUE '+state.blue;redScoreEl.textContent='RED '+state.red;healthEl.textContent='HP '+Math.max(0,Math.round(hp));ammoEl.textContent=reloading?'NẠP ĐẠN...':ammo+' / '+reserve;timerEl.textContent=String(Math.max(0,Math.floor(timeLeft/60))).padStart(2,'0')+':'+String(Math.max(0,Math.ceil(timeLeft%60))).padStart(2,'0')}
function endGame(){if(gameOver)return;gameOver=true;document.exitPointerLock();document.querySelector('#end').style.display='flex';const win=state.blue>=30?'BLUE':state.red>=30?'RED':state.blue>state.red?'BLUE':'RED';document.querySelector('#winner').textContent=win+' TEAM THẮNG!';document.querySelector('#final').textContent='Tỉ số cuối: BLUE '+state.blue+' — '+state.red+' RED'}
function score(team,killer,victim){state[team]++;flash((team==='blue'?'BLUE':'RED')+' +1 | '+killer+' hạ '+victim);if(state[team]>=30)endGame()}
function respawnPlayer(){hp=100;ammo=30;reserve=120;reloading=false;const p=blueSpawn[Math.floor(Math.random()*blueSpawn.length)];camera.position.set(p[0],1.7,p[2]);respawnAt=0;flash('Bạn đã hồi sinh')}
function killPlayer(killer){if(respawnAt)return;hp=0;respawnAt=performance.now()+4000;score('red',killer,'Bạn');flash('Bạn bị hạ — hồi sinh sau 4 giây')}
function reload(){if(!started||gameOver||reloading||ammo>=30||reserve<=0)return;reloading=true;setTimeout(()=>{const n=Math.min(30-ammo,reserve);ammo+=n;reserve-=n;reloading=false},900)}
const ray=new THREE.Raycaster();
function shoot(){if(!started||gameOver||reloading||respawnAt||shootCD>0)return;if(ammo<=0){reload();return}ammo--;shootCD=.13;ray.setFromCamera(new THREE.Vector2(0,0),camera);const targets=bots.filter(b=>b.alive&&b.team==='red').map(b=>b.g.children[0]);const hits=ray.intersectObjects(targets,false);if(hits.length){const b=bots.find(x=>x.g.children[0]===hits[0].object);if(b){b.hp-=34;if(b.hp<=0){b.alive=false;b.respawn=performance.now()+4000;b.g.visible=false;score('blue','Bạn','RED-'+(b.i+1))}}}const end=ray.ray.origin.clone().add(ray.ray.direction.clone().multiplyScalar(70));const geo=new THREE.BufferGeometry().setFromPoints([ray.ray.origin.clone(),end]);const mat=new THREE.LineBasicMaterial({color:0xffffcc,transparent:true,opacity:.22});const line=new THREE.Line(geo,mat);scene.add(line);setTimeout(()=>scene.remove(line),45)}
renderer.domElement.addEventListener('mousedown',e=>{if(e.button===0){if(document.pointerLockElement!==renderer.domElement)renderer.domElement.requestPointerLock();shoot()}});
addEventListener('mousemove',e=>{if(document.pointerLockElement!==renderer.domElement||!started)return;yaw-=e.movementX*.0022;pitch-=e.movementY*.0022;pitch=Math.max(-1.45,Math.min(1.45,pitch));camera.rotation.set(pitch,yaw,0)});
function movePlayer(dt){if(respawnAt)return;const dir=new THREE.Vector3((keys.KeyD?1:0)-(keys.KeyA?1:0),0,(keys.KeyS?1:0)-(keys.KeyW?1:0));if(!dir.length())return;dir.normalize().applyAxisAngle(new THREE.Vector3(0,1,0),yaw);const np=camera.position.clone().addScaledVector(dir,(keys.ShiftLeft?10:6)*dt);np.y=1.7;if(np.x>-39&&np.x<39&&np.z>-27&&np.z<27)camera.position.copy(np)}
function botFire(b,dt){if(!b.alive||b.team!=='red')return;b.fire-=dt;if(b.fire>0)return;b.fire=1+Math.random()*1.2;const dx=camera.position.x-b.g.position.x,dz=camera.position.z-b.g.position.z,dist=Math.hypot(dx,dz);if(dist>36)return;const aim=Math.atan2(dx,dz),diff=Math.atan2(Math.sin(aim-yaw),Math.cos(aim-yaw));if(Math.abs(diff)<.24&&Math.random()<.72){hp-=18;if(hp<=0)killPlayer('RED-'+(b.i+1))}}
function updateBots(dt){for(const b of bots){if(!b.alive){if(performance.now()>=b.respawn){b.alive=true;b.hp=100;b.g.visible=true;const p=b.team==='blue'?blueSpawn[b.i]:redSpawn[b.i];b.g.position.set(p[0],0,p[2])}continue}let target=camera.position;if(b.team==='blue'){const enemies=bots.filter(x=>x.alive&&x.team==='red');if(enemies.length)target=enemies.reduce((a,c)=>b.g.position.distanceTo(c.g.position)<b.g.position.distanceTo(a.g.position)?c:a).g.position}const dx=target.x-b.g.position.x,dz=target.z-b.g.position.z,d=Math.hypot(dx,dz);if(d>8){b.g.position.x+=dx/d*dt*2.2;b.g.position.z+=dz/d*dt*2.2}else{b.path+=dt*(Math.random()>.5?1:-1);b.g.position.x+=Math.cos(b.path)*dt*.7;b.g.position.z+=Math.sin(b.path)*dt*.7}b.g.position.x=Math.max(-37,Math.min(37,b.g.position.x));b.g.position.z=Math.max(-25,Math.min(25,b.g.position.z));b.g.lookAt(target.x,1.2,target.z);botFire(b,dt)}}
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;if(started&&!gameOver){timeLeft-=dt;if(timeLeft<=0)endGame();shootCD=Math.max(0,shootCD-dt);if(respawnAt&&performance.now()>=respawnAt)respawnPlayer();movePlayer(dt);updateBots(dt);updateUI()}renderer.render(scene,camera)}loop(performance.now());
document.querySelector('#startBtn').onclick=()=>{started=true;document.querySelector('#start').style.display='none';renderer.domElement.requestPointerLock();last=performance.now()};document.querySelector('#restart').onclick=()=>location.reload();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
